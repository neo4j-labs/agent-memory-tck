spring.application.name=swiss-travel-advisor
spring.datasource.driver-class-name=org.duckdb.DuckDBDriver
spring.datasource.url=jdbc:duckdb:memory:swiss_travel;jdbc_pin_db=true
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=INSTALL spatial; LOAD spatial; SET geometry_always_xy=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=600000
spring.flyway.locations=classpath:db/duckdb
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.timeout=60s
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5.6-terra}
spring.ai.openai.chat.reasoning-effort=${OPENAI_REASONING_EFFORT:none}
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.dimensions=1536
app.ai.pretty-logging.include-content=${AI_LOGGING_INCLUDE_CONTENT:true}
# Boot maps OTEL_TRACES_EXPORTER above this default when the environment opts in.
management.tracing.export.otlp.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
management.opentelemetry.tracing.export.otlp.transport=${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
management.opentelemetry.resource-attributes.service.namespace=travel-demo
management.opentelemetry.resource-attributes.deployment.environment.name=local
# The standalone demo exports neither metrics nor logs to a collector.
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

app.memory.endpoint=${NAMS_BASE_URL:https://memory.neo4jlabs.com/v1}
app.memory.api-key=${NAMS_API_KEY:}
app.memory.timeout=${NAMS_TIMEOUT:10s}

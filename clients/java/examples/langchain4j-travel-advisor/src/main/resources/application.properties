micronaut.application.name=swiss-travel-advisor

# Serve the zero-build chat interface from the application root.
micronaut.router.static-resources.ui.mapping=/**
micronaut.router.static-resources.ui.paths=classpath:public

# One process owns this named, pinned in-memory database.
datasources.default.driverClassName=org.duckdb.DuckDBDriver
datasources.default.url=jdbc:duckdb:memory:swiss_travel;jdbc_pin_db=true
# Flyway and Hikari must use identical JDBC credential properties.
datasources.default.username=
datasources.default.password=
datasources.default.connection-init-sql=INSTALL spatial; LOAD spatial; SET geometry_always_xy=true
datasources.default.maximum-pool-size=5
datasources.default.minimum-idle=1
datasources.default.connection-timeout=10000
datasources.default.validation-timeout=5000
datasources.default.idle-timeout=300000
datasources.default.keepalive-time=120000
datasources.default.max-lifetime=600000

flyway.datasources.default.enabled=true
flyway.datasources.default.locations=classpath:db/duckdb

# Read native conversation context for each model invocation.
langchain4j.chat-memory-store.inmemory.enabled=false

langchain4j.open-ai.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
langchain4j.open-ai.chat-model.model-name=${OPENAI_CHAT_MODEL:gpt-5.6-terra}
# Terra supports tool calling through Chat Completions when reasoning is disabled.
langchain4j.open-ai.chat-model.reasoning-effort=${OPENAI_REASONING_EFFORT:none}
langchain4j.open-ai.chat-model.timeout=60s

langchain4j.open-ai.embedding-model.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
langchain4j.open-ai.embedding-model.model-name=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
# DuckDB stores FLOAT[1536]; request that size from providers with larger defaults.
langchain4j.open-ai.embedding-model.dimensions=1536
langchain4j.open-ai.embedding-model.timeout=60s

nams.base-url=${NAMS_BASE_URL:`https://memory.neo4jlabs.com/v1`}
nams.api-key=${NAMS_API_KEY:}
nams.wait-timeout=30s
